<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Key Rush – Ice Breaking Informatika</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#070b16;--panel:#0f1730;--line:#223056;--tx:#e8eeff;--mut:#8b9ac4;--c1:#22d3ee;--c2:#8b5cf6;--ok:#34d399;--bad:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 15% -10%,#1b2a6b55,transparent),radial-gradient(700px 500px at 100% 110%,#5b21b655,transparent),var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;justify-content:center;align-items:center;padding:16px;overflow:auto}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.18;pointer-events:none}
.app{position:relative;width:100%;max-width:720px;background:linear-gradient(160deg,#0f1730ee,#0a1024ee);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 0 60px #22d3ee14,0 20px 60px #000a}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.14em;font-size:15px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#0b1226;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--mut)}
.chip b{color:var(--tx);font-variant-numeric:tabular-nums}
.lives{color:var(--bad);letter-spacing:2px}
.hidden{display:none!important}
.stage{background:#080e20;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.ch{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:clamp(96px,26vw,170px);font-weight:800;line-height:1.1;color:var(--c1);text-shadow:0 0 28px #22d3ee99;min-height:1.15em;transition:transform .12s,color .12s}
.ch.ok{color:var(--ok);text-shadow:0 0 28px #34d399aa;transform:scale(1.08)}
.ch.bad{color:var(--bad);text-shadow:0 0 28px #fb7185aa;transform:translateX(6px)}
.bar{height:10px;border-radius:8px;background:#121b38;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:8px}
.pips{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.pips s{width:26px;height:8px;border-radius:5px;background:#16213f;text-decoration:none}
.pips s.on{background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 10px #22d3ee88}
.hint{color:var(--mut);font-size:13px;min-height:1.4em}
.combo{color:#fbbf24;font-weight:700}
h1{margin:6px 0 6px;font-size:clamp(28px,6vw,40px)}
p{color:var(--mut);line-height:1.55;margin:6px 0}
.center{text-align:center}
input{width:100%;max-width:340px;background:#0b1226;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 14px;font-size:16px;margin:12px 0;outline:none}
input:focus{border-color:var(--c1);box-shadow:0 0 0 3px #22d3ee22}
button{cursor:pointer;border:0;border-radius:12px;padding:13px 28px;font-size:16px;font-weight:700;color:#04101f;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 24px #22d3ee44}
button:hover{filter:brightness(1.1)}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);box-shadow:none;padding:6px 12px;font-size:13px}
.lv{margin:18px auto 4px;max-width:340px;text-align:left;font-size:14px}
.lv div{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);color:var(--mut)}
.lv div:first-child{color:var(--c1);font-weight:700;border-bottom-color:var(--c1)}
.lv b{color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:#0b1226;border:1px solid var(--line);border-radius:12px;padding:12px}
.stats b{display:block;font-size:24px;color:var(--c1)}
.stats span{font-size:12px;color:var(--mut)}
.toast{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(36px,9vw,64px);font-weight:800;letter-spacing:.1em;background:#070b16cc;border-radius:20px;color:var(--c1);text-shadow:0 0 30px #22d3ee;z-index:5}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">KEY RUSH · INFORMATIKA</div>
    <div class="chips">
      <div class="chip">Level <b id="lv">1</b></div>
      <div class="chip">Skor <b id="sc">0</b></div>
      <div class="chip lives" id="hp">♥♥♥</div>
      <button class="ghost" id="mute">Suara: ON</button>
    </div>
  </div>

  <section id="start" class="center">
    <h1>Siap menguji kecepatan jarimu?</h1>
    <p>Tekan tombol keyboard yang sama dengan karakter di layar. Setiap 10 benar, level naik dan waktu makin singkat.</p>
    <input id="nm" maxlength="30" placeholder="Nama (boleh berpasangan)" autocomplete="off">
    <div><button id="go">MULAI</button></div>
    <div class="lv" id="board"></div>
  </section>

  <section id="play" class="hidden">
    <div class="stage">
      <div class="pips" id="pips"></div>
      <div class="ch" id="ch">?</div>
      <div class="bar"><i id="tb"></i></div>
      <div class="hint" id="hint">&nbsp;</div>
    </div>
  </section>

  <section id="over" class="hidden center">
    <h1>Waktu habis!</h1>
    <p id="who"></p>
    <div class="stats">
      <div><b id="fs">0</b><span>Skor</span></div>
      <div><b id="fl">1</b><span>Level tertinggi</span></div>
      <div><b id="fa">0%</b><span>Ketepatan</span></div>
    </div>
    <button id="again">MAIN LAGI</button>
    <div class="lv" id="board2"></div>
  </section>
  <div class="toast hidden" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const POOLS=["0123456789","abcdefghijklmnopqrstuvwxyz","abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ","abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789","abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*?+=-"];
const limit=l=>Math.max(0.6,3.2-(l-1)*0.4)*1000;
let S={},audio=null,muted=false,raf=0,name="";

function beep(f,d,t){if(muted||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function loadLB(){try{return JSON.parse(localStorage.getItem("keyrush.lb")||"[]")}catch(e){return[]}}
function saveLB(r){try{const a=loadLB();a.push(r);a.sort((x,y)=>y.s-x.s);localStorage.setItem("keyrush.lb",JSON.stringify(a.slice(0,5)))}catch(e){}}
function drawLB(){const a=loadLB();const h='<div>Papan skor komputer ini</div>'+(a.length?a.map((r,i)=>`<div><span>${i+1}. ${r.n.replace(/[<>&]/g,"")}</span><b>${r.s} · Lv ${r.l}</b></div>`).join(""):"<div><span>Belum ada skor</span><b>–</b></div>");$("#board").innerHTML=h;$("#board2").innerHTML=h}
function hud(){$("#lv").textContent=S.level;$("#sc").textContent=S.score;$("#hp").textContent="♥".repeat(S.lives)+"♡".repeat(3-S.lives);$("#pips").innerHTML=Array.from({length:10},(_,i)=>`<s class="${i<S.hit?"on":""}"></s>`).join("");$("#hint").innerHTML=S.streak>=5?`<span class="combo">Combo ×${1+Math.floor(S.streak/5)} 🔥</span>`:`Waktu per karakter: ${(limit(S.level)/1000).toFixed(1)} detik`}
function show(id){["start","play","over"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==id))}
function next(){const p=POOLS[Math.min(S.level,5)-1];let c;do{c=p[Math.floor(Math.random()*p.length)]}while(c===S.cur);S.cur=c;S.t0=performance.now();S.dur=limit(S.level);const e=$("#ch");e.className="ch";e.textContent=c;hud();S.on=true}
function flash(k){const e=$("#ch");e.className="ch "+k}
function tick(){if(S.on){const r=1-(performance.now()-S.t0)/S.dur;$("#tb").style.width=Math.max(0,r*100)+"%";if(r<=0)miss()}raf=requestAnimationFrame(tick)}
function ok(){S.on=false;S.right++;S.total++;S.streak++;S.hit++;S.score+=10*S.level*(1+Math.floor(S.streak/5));flash("ok");beep(660+S.streak*20,.12);
  if(S.hit>=10){S.level++;S.hit=0;beep(880,.25,"triangle");const t=$("#toast");t.textContent="LEVEL "+S.level;t.classList.remove("hidden");setTimeout(()=>{t.classList.add("hidden");next()},1100)}else setTimeout(next,110)}
function miss(){S.on=false;S.total++;S.lives--;S.streak=0;flash("bad");beep(160,.25,"sawtooth");hud();if(S.lives<=0)setTimeout(end,350);else setTimeout(next,350)}
function end(){cancelAnimationFrame(raf);saveLB({n:name,s:S.score,l:S.level});drawLB();$("#who").textContent=name;$("#fs").textContent=S.score;$("#fl").textContent=S.level;$("#fa").textContent=(S.total?Math.round(S.right/S.total*100):0)+"%";show("over")}
function start(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  name=$("#nm").value.trim()||"Pemain";S={on:false,level:1,score:0,lives:3,hit:0,streak:0,total:0,right:0,cur:""};show("play");next();cancelAnimationFrame(raf);tick()}
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!$("#start").classList.contains("hidden")&&document.activeElement.id==="nm"){start();return}
  if(!S.on||e.ctrlKey||e.metaKey||e.altKey||e.key.length!==1)return;
  e.preventDefault();e.key===S.cur?ok():miss()});
$("#go").onclick=start;$("#again").onclick=()=>show("start");
$("#mute").onclick=()=>{muted=!muted;$("#mute").textContent="Suara: "+(muted?"OFF":"ON")};
drawLB();
</script>
</body>
</html>
