<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Ice Breaking Informatika – Pilih Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#070b16;--line:#223056;--tx:#e8eeff;--mut:#8b9ac4;--c1:#22d3ee;--c2:#8b5cf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 10% -10%,#1b2a6b55,transparent),radial-gradient(700px 500px at 100% 110%,#5b21b655,transparent),var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:24px 16px}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.16;pointer-events:none}
.wrap{position:relative;max-width:860px;margin:0 auto}
.logo{font-weight:800;letter-spacing:.16em;font-size:13px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
h1{text-align:center;margin:8px 0 6px;font-size:clamp(28px,6vw,44px)}
.sub{text-align:center;color:var(--mut);margin:0 0 26px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:6px;background:linear-gradient(160deg,#0f1730ee,#0a1024ee);border:1px solid var(--line);border-radius:18px;padding:18px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c1);box-shadow:0 0 30px #22d3ee22}
.top{display:flex;justify-content:space-between;align-items:center}
.ico{font-size:34px}
.tag{font-size:11px;letter-spacing:.08em;color:var(--c1);border:1px solid var(--c1);border-radius:999px;padding:3px 10px}
.card h2{margin:4px 0 0;font-size:22px}
.card p{margin:0;color:var(--mut);font-size:14px;line-height:1.5;flex:1}
.champ{font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px;margin-top:8px;min-height:2.2em}
.champ b{color:#fbbf24}
.play{margin-top:6px;text-align:center;font-weight:700;color:#04101f;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:12px;padding:10px}
.lb{display:block;margin:22px auto 0;max-width:420px;text-align:center;text-decoration:none;font-weight:700;color:var(--tx);background:#0b1226cc;border:1px solid var(--c2);border-radius:14px;padding:14px;transition:box-shadow .15s}
.lb:hover{box-shadow:0 0 26px #8b5cf633}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">ICE BREAKING · INFORMATIKA</div>
  <h1>Pilih game, mulai tantangan!</h1>
  <p class="sub">Semua game punya mode <b>Solo</b> dan <b>Pasangan</b>. Skor tiap game masuk ke peringkat kelas.</p>
  <div class="grid" id="grid"></div>
  <a class="lb" href="leaderboard.html">🏆 Lihat Papan Peringkat Kelas</a>
  <div class="foot">Gunakan Chrome atau Edge untuk pengalaman terbaik · aktifkan suara komputer</div>
</div>
<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbzs38C8Gj4I-7j72h4Evk9fijO_WSiJAu-4ouRWvS67TyMS28TbbB4cazxSogfDHV3TaA/exec";
const GAMES=[
 {id:"keyrush",f:"key-rush.html",i:"⌨️",n:"Key Rush",t:"KEYBOARD",d:"Tekan huruf, angka, dan simbol yang muncul sebelum waktu habis. Level naik, waktu makin singkat."},
 {id:"klik",f:"klik-target.html",i:"🎯",n:"Klik Target",t:"MOUSE",d:"Klik lingkaran sebelum cincinnya menyusut. Target makin kecil dan makin cepat di tiap level."},
 {id:"pola",f:"pola-cahaya.html",i:"💡",n:"Pola Cahaya",t:"MEMORI",d:"Ingat urutan pad yang menyala, lalu ulangi. Tiap ronde urutannya bertambah panjang."},
 {id:"sandi",f:"sandi-kilat.html",i:"🔐",n:"Sandi Kilat",t:"LOGIKA",d:"Pecahkan kata rahasia dalam sandi Caesar memakai kunci geser dan tabel huruf."}
];
const g=document.getElementById("grid");
GAMES.forEach(x=>{
  const a=document.createElement("a");a.className="card";a.href=x.f;
  const top=document.createElement("div");top.className="top";
  const ic=document.createElement("span");ic.className="ico";ic.textContent=x.i;
  const tg=document.createElement("span");tg.className="tag";tg.textContent=x.t;top.append(ic,tg);
  const h=document.createElement("h2");h.textContent=x.n;
  const p=document.createElement("p");p.textContent=x.d;
  const c=document.createElement("div");c.className="champ";c.id="c-"+x.id;c.textContent="Juara: belum ada";
  const b=document.createElement("div");b.className="play";b.textContent="MAIN";
  a.append(top,h,p,c,b);g.append(a);
  if(!SHEET_URL)return;
  fetch(SHEET_URL+"?game="+x.id).then(r=>r.json()).then(rows=>{
    if(!Array.isArray(rows)||!rows.length)return;
    const t=rows.slice().sort((m,n)=>n.s-m.s)[0];
    c.textContent="";c.append("🏆 Juara: ");
    const bb=document.createElement("b");bb.textContent=String(t.n)+" · "+t.s;c.append(bb);
  }).catch(()=>{});
});
</script>
</body>
</html>
