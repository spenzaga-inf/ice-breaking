<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Key Rush – Dashboard Peringkat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#070b16;--panel:#0f1730;--line:#223056;--tx:#e8eeff;--mut:#8b9ac4;--c1:#22d3ee;--c2:#8b5cf6;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#fb923c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 10% -10%,#1b2a6b55,transparent),radial-gradient(700px 500px at 100% 110%,#5b21b655,transparent),var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:20px}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.16;pointer-events:none}
.wrap{position:relative;max-width:1000px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.14em;font-size:clamp(16px,2.4vw,22px);background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:p 1.6s infinite}
.dot.off{background:#fb7185;box-shadow:0 0 10px #fb7185}
@keyframes p{50%{opacity:.35}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.tabs button{background:#0b1226cc;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{color:#04101f;background:linear-gradient(90deg,var(--c1),var(--c2));border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:#0b1226cc;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:clamp(20px,4vw,30px);color:var(--c1);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;margin:22px 0}
.pod{background:linear-gradient(170deg,#101a3a,#0a1126);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
.pod.r1{min-height:230px;border-color:var(--gold);box-shadow:0 0 32px #fbbf2422}
.pod.r2{min-height:185px;border-color:var(--silver)}
.pod.r3{min-height:150px;border-color:var(--bronze)}
.medal{font-size:clamp(28px,6vw,44px)}
.pn{font-weight:700;font-size:clamp(14px,2.6vw,20px);overflow-wrap:anywhere}
.ps{font-size:clamp(22px,4.5vw,34px);font-weight:800;color:var(--c1);font-variant-numeric:tabular-nums}
.pl{font-size:12px;color:var(--mut)}
.list{display:flex;flex-direction:column;gap:8px}
.row{position:relative;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;background:#0b1226cc;border:1px solid var(--line);border-radius:12px;padding:10px 14px;overflow:hidden;animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.row i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#22d3ee22,#8b5cf622);transition:width .8s}
.row>*{position:relative}
.rk{font-weight:800;color:var(--mut);font-size:18px}
.nm{font-weight:600;overflow-wrap:anywhere}
.sc{font-variant-numeric:tabular-nums;font-weight:700}
.sc small{color:var(--mut);font-weight:400;margin-left:8px}
.note{margin-top:16px;font-size:12px;color:var(--mut);text-align:center;min-height:1.4em}
@media(max-width:520px){body{padding:12px}.podium{gap:6px}.pod{padding:12px 4px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo" id="logo">PERINGKAT KELAS</div>
    <div class="live"><span class="dot" id="dot"></span><span id="upd">Memuat…</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stats">
    <div class="stat"><b id="s1">0</b><span>Pemain / pasangan</span></div>
    <div class="stat"><b id="s2">0</b><span>Rekor skor</span></div>
    <div class="stat"><b id="s3">1</b><span id="s3l">Level tertinggi</span></div>
  </div>
  <div class="podium" id="pod"></div>
  <div class="list" id="list"></div>
  <div class="note" id="note"></div>
</div>

<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbzs38C8Gj4I-7j72h4Evk9fijO_WSiJAu-4ouRWvS67TyMS28TbbB4cazxSogfDHV3TaA/exec"; // tempel URL Web App Apps Script (berakhiran /exec) di antara tanda kutip
const REFRESH_MS=5000;
const GAMES=[{id:"keyrush",n:"Key Rush",full:"Level"},{id:"klik",n:"Klik Target",full:"Level"},{id:"pola",n:"Pola Cahaya",full:"Ronde"},{id:"sandi",n:"Sandi Kilat",full:"Level"}];
let cur=GAMES[0];
const DEMO=[{n:"Raka & Dina",s:1840,l:7},{n:"Salsa",s:1520,l:6},{n:"Bima & Tika",s:1390,l:6},{n:"Naufal",s:1120,l:5},{n:"Putri & Ayu",s:980,l:5},{n:"Fajar",s:760,l:4},{n:"Zahra",s:640,l:4},{n:"Dimas & Nia",s:420,l:3}];
const $=s=>document.querySelector(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function best(rows){const m=new Map();for(const r of rows){const n=String(r.n||"").trim();if(!n)continue;const k=n.toLowerCase(),s=+r.s||0,o=m.get(k);if(!o||s>o.s)m.set(k,{n,s,l:+r.l||1})}return[...m.values()].sort((a,b)=>b.s-a.s)}
function render(list){
  $("#s1").textContent=list.length;
  $("#s2").textContent=list.length?list[0].s:0;
  $("#s3l").textContent=cur.full+" tertinggi";
  $("#s3").textContent=list.reduce((m,r)=>Math.max(m,r.l),1);
  const pod=$("#pod");pod.innerHTML="";
  [[1,"r2","🥈"],[0,"r1","🥇"],[2,"r3","🥉"]].forEach(([i,c,m])=>{
    const r=list[i],d=el("div","pod "+c);
    d.append(el("div","medal",m),el("div","pn",r?r.n:"—"),el("div","ps",r?r.s:"–"),el("div","pl",r?cur.full+" "+r.l:"Belum ada"));
    pod.append(d)});
  const box=$("#list");box.innerHTML="";
  const max=list.length?list[0].s||1:1;
  list.slice(3,10).forEach((r,i)=>{
    const d=el("div","row"),b=el("i");b.style.width=Math.max(4,r.s/max*100)+"%";d.style.animationDelay=i*60+"ms";
    const sc=el("div","sc",String(r.s));sc.append(el("small","",(cur.full==="Ronde"?"Ronde ":"Lv ")+r.l));
    d.append(b,el("div","rk",String(i+4)),el("div","nm",r.n),sc);box.append(d)})}
async function load(){
  try{
    const rows=SHEET_URL?await (await fetch(SHEET_URL+"?game="+cur.id,{cache:"no-store"})).json():DEMO;
    render(best(Array.isArray(rows)?rows:[]));
    $("#dot").classList.remove("off");
    $("#upd").textContent="Live · diperbarui "+new Date().toLocaleTimeString("id-ID");
    $("#note").textContent=SHEET_URL?"":"Mode demo: isi SHEET_URL di file ini untuk menampilkan data asli.";
  }catch(e){$("#dot").classList.add("off");$("#upd").textContent="Menunggu koneksi…"}}
function pick(id){cur=GAMES.find(g=>g.id===id)||GAMES[0];document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.id===cur.id));$("#logo").textContent=cur.n.toUpperCase()+" · PERINGKAT KELAS";try{history.replaceState(null,"","#"+cur.id)}catch(e){}load()}
GAMES.forEach(g=>{const b=el("button","",g.n);b.dataset.id=g.id;b.onclick=()=>pick(g.id);$("#tabs").append(b)});
pick(location.hash.slice(1));setInterval(load,REFRESH_MS);
</script>
</body>
</html>
